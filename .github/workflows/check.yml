# Every push: the tests on a real Windows PC (including Windows' own text recognition) and a test build.
name: Check
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's Windows machines may lack English text recognition; add it so the OCR test really runs.
      - name: English text recognition for the OCR test
        shell: powershell
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ocr = Get-WindowsCapability -Online | Where-Object { $_.Name -like 'Language.OCR*en-US*' }
          if ($ocr -and $ocr.State -ne 'Installed') { Add-WindowsCapability -Online -Name $ocr.Name | Out-Null }
          Get-WindowsCapability -Online | Where-Object { $_.Name -like 'Language.OCR*' } | Format-Table Name, State
      - run: npm test
      - name: Build the installer (not published)
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ClimbCoach-installer
          path: dist/*.exe
          retention-days: 7
